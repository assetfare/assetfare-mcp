version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Routine version churn is reviewed in scheduled maintenance batches.
    # GitHub Dependabot security updates remain enabled at repository level.
    open-pull-requests-limit: 0
    groups:
      root-runtime:
        dependency-type: production
      root-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /integrations/agenti
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-agenti-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /integrations/coinbase-agentkit
