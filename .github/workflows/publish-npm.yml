name: Publish npm with OIDC

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm CLI with trusted-publishing support
        run: npm install --global npm@12.1.0
      - name: Verify immutable tag and package version
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "false"
          test "$(npm --version)" = "12.1.0"
      - name: Install exact dependencies
        run: npm ci
      - name: Verify package
        run: |
          npm run check
          npm test
          npm run route-eval-selftest
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run
      - name: Verify immutable release asset digest
        id: release_asset
        run: |
          npm pack --json > npm-pack.json
          artifact="$(node -e 'const packResult=require("./npm-pack.json");const entries=Array.isArray(packResult)?packResult:Object.values(packResult);if(entries.length!==1||typeof entries[0]?.filename!=="string")process.exit(1);process.stdout.write(entries[0].filename)')"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$asset_dir" --pattern "$artifact" --pattern "$artifact.sha256"
          test -f "$asset_dir/$artifact"
          test -f "$asset_dir/$artifact.sha256"
          (cd "$asset_dir" && sha256sum -c "$artifact.sha256")
          test "$(sha256sum "$artifact" | cut -d' ' -f1)" = "$(sha256sum "$asset_dir/$artifact" | cut -d' ' -f1)"
          echo "artifact_path=$asset_dir/$artifact" >> "$GITHUB_OUTPUT"
      - name: Refuse a conflicting existing registry version
        id: registry_state
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          expected_shasum="$(sha1sum "${{ steps.release_asset.outputs.artifact_path }}" | cut -d' ' -f1)"
          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            existing_shasum="$(npm view "$package_name@$package_version" dist.shasum)"
            if test "$existing_shasum" != "$expected_shasum"; then
              echo "Refusing conflicting $package_name@$package_version: artifact digest mismatch" >&2
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with short-lived npm OIDC credentials
        if: steps.registry_state.outputs.already_published != 'true'
        run: npm publish "${{ steps.release_asset.outputs.artifact_path }}" --access public
      - name: Verify npm latest dist-tag
        run: |
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          expected_shasum="$(sha1sum "${{ steps.release_asset.outputs.artifact_path }}" | cut -d' ' -f1)"
          for attempt in $(seq 1 60); do
            if test "$(npm view "$package_name" dist-tags.latest 2>/dev/null)" = "$package_version"; then
              test "$(npm view "$package_name@$package_version" dist.shasum)" = "$expected_shasum"
              exit 0
            fi
            sleep 5
          done
          echo "npm latest did not converge to $package_version" >&2
          exit 1
