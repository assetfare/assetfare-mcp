name: Release provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to reproduce and attest
        required: true
        type: string

permissions:
  contents: read

jobs:
  pack-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - run: npm ci
      - run: npm test
      - name: Build deterministic npm release asset
        id: pack
        run: |
          npm pack --json > npm-pack.json
          artifact="$(node -p 'require("./npm-pack.json")[0].filename')"
          test -f "$artifact"
          sha256sum "$artifact" > "$artifact.sha256"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Upload immutable release assets
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.pack.outputs.artifact }}" \
            "${{ steps.pack.outputs.artifact }}.sha256" \
            --clobber
      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.artifact }}
