interface:
  display_name: "AssetFare Route"
  short_description: "Native-USDC bridge quotes and caller-approved unsigned plans."
  default_prompt: "Use $assetfare-route to compare an AssetFare route's total cost across six chains. Solana native USDC to Base native USDC is the canonical example. USD 1 is reachability/schema smoke only; native-USDC economic comparison starts at USD 50 based on dated 2026-09-23 evidence, without guaranteeing AssetFare is cheapest. Use USD 1,000 as the primary representative amount, including for SOL-input routes that include a swap, and always compare fresh candidates at the actual intended amount. Verify live capabilities and the signed manifest, obtain a fresh quote, and stop before unsigned preparation, signing, or submission unless the caller explicitly approves continuation."
