interface:
  display_name: "AssetFare Route"
  short_description: "Quote-bound bridge routes with verified provider paths."
  default_prompt: "Use $assetfare-route to compare an AssetFare candidate across six chains. Require direct_route_summary and continuation_v3; verify the full-quote hash, ordered providers, bounds, wallet/signer requirements, TTL, and no-sign/no-submit flags. Keep selection_status=unranked_candidate unless a separate explicit assetfare-select operation chooses an allowed mode and non-weaker bounds. caller_approved:true is not human proof and must never be auto-inserted. Multi-step routes are session-only. Use USD 1,000 as representative, not a cheapest guarantee, and stop before signing or submission."
